# /etc/nginx/sites-available/sprosinab
#
# Конфиг на 80-м порту. HTTPS добавит certbot: команда
#     certbot --nginx -d app.nablabel.ru
# сама допишет сюда сертификат, 443-й порт и редирект с http на https.
# Руками ничего дописывать не нужно.
#
# Статика Mini App лежит в /var/www/sprosinab, а не в /root/sprosinab/webapp:
# nginx работает от пользователя www-data и в папку /root заглянуть не может.
# Код бота при этом остаётся в /root/sprosinab.

server {
    listen 80;
    listen [::]:80;
    server_name app.nablabel.ru;

    # Telegram открывает Mini App во фрейме — рамки не запрещаем.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Фото поломок: до 5 штук, запас по размеру
    client_max_body_size 64m;

    root /var/www/sprosinab;
    index index.html;

    # --- Статика Mini App ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Картинки (FAQ, НПБ, фирменные элементы) кешируем на неделю
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html и код — всегда свежие, иначе студенты увидят старую версию
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /app.js     { add_header Cache-Control "no-cache"; }
    location = /styles.css { add_header Cache-Control "no-cache"; }

    # --- API бота (Python слушает только localhost) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;
}
